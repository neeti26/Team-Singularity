# Cloud Build configuration for CI/CD pipeline
# Team Singularity — AI Builder Cup 2026
# Triggered automatically on push to main branch
steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/team-singularity:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/team-singularity:latest'
      - '.'
    timeout: '1200s'

  # Step 2: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/team-singularity:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/team-singularity:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'team-singularity'
      - '--image=gcr.io/$PROJECT_ID/team-singularity:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--set-secrets=GEMINI_API_KEY=singularity-gemini-key:latest,FIREBASE_PROJECT_ID=singularity-firebase-project:latest,FIREBASE_CLIENT_EMAIL=singularity-firebase-email:latest,FIREBASE_PRIVATE_KEY=singularity-firebase-key:latest,NEXT_PUBLIC_FIREBASE_API_KEY=singularity-fb-api-key:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=singularity-fb-auth-domain:latest,NEXT_PUBLIC_FIREBASE_PROJECT_ID=singularity-fb-project-id:latest,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=singularity-fb-storage:latest,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=singularity-fb-sender:latest,NEXT_PUBLIC_FIREBASE_APP_ID=singularity-fb-app-id:latest'

images:
  - 'gcr.io/$PROJECT_ID/team-singularity:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/team-singularity:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
